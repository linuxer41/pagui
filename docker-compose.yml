version: '3.9'

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ========================================
  # Postgres (Primario)
  # ========================================
  postgres:
    image: postgres:17-alpine
    container_name: pagui-postgres
    environment:
      POSTGRES_DB: pagui
      POSTGRES_USER: pagui
      POSTGRES_PASSWORD: pagui
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagui"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *logging
    networks:
      - pagui-net

  # ========================================
  # Redis (Cache + Sesiones + Colas)
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: pagui-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *logging
    networks:
      - pagui-net

  # ========================================
  # Backend API
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pagui-backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://pagui:pagui@postgres:5432/pagui
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-not-for-prod}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key}
      - SNOWFLAKE_WORKER_ID=${SNOWFLAKE_WORKER_ID:-1}
      - NODE_ENV=production
      - LOG_LEVEL=info
      - SENTRY_DSN=${SENTRY_DSN:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *logging
    networks:
      - pagui-net

  # ========================================
  # Nginx (Reverse Proxy + Rate Limiting)
  # ========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: pagui-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/sites:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    logging: *logging
    networks:
      - pagui-net

  # ========================================
  # pgAdmin (Desarrollo)
  # ========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pagui-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pagui.bo
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - dev
    logging: *logging
    networks:
      - pagui-net

  # ========================================
  # Redis Commander (Desarrollo)
  # ========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: pagui-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - dev
    logging: *logging
    networks:
      - pagui-net

  # ========================================
  # OpenTelemetry Collector (Tracing)
  # ========================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: pagui-otel
    command:
      - "--config=/etc/otel-collector.yml"
    volumes:
      - ./otel-collector.yml:/etc/otel-collector.yml:ro
      - oteldata:/data
    ports:
      - "4318:4318"   # OTLP HTTP
      - "4317:4317"   # OTLP gRPC
      - "8888:8888"   # Prometheus metrics
    profiles:
      - tracing
    logging: *logging
    networks:
      - pagui-net

volumes:
  pgdata:
  redisdata:
  pgadmindata:
  oteldata:

networks:
  pagui-net:
    name: pagui-network
    driver: bridge
